<svg width="440" height="230" viewBox="0 0 440 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="438" height="228" rx="14" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>

  <!-- Ícone e Título -->
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#eef3f0"/>
