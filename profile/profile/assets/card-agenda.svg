<svg width="440" height="230" viewBox="0 0 440 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect x="1" y="1" width="438" height="228" rx="14" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>

  <!-- Header Card com Ícone e Título -->
  <rect x="24" y="24" width="40" height="40" rx="10" fill="#eef3f0"/>
  <!-- Ícone de Calendário -->
  <rect x="34" y="34" width="20" height="20" rx="4" stroke="#4a6b5d" stroke-width="2"/>
  <line x1="34" y1="41" x2="54" y2="41" stroke="#4a6b5d" stroke-width="2"/>
  <circle cx="39" cy="47" r="1.5" fill="#4a6b5d"/>
  <circle cx="44" cy="47" r="1.5" fill="#4a6b5d"/>
  <circle cx="49" cy="47" r="1.5" fill="#4a6b5d"/>

  <text x="76" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#1c2826">TI Suporte Agenda</text>
  <text x="76" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4a6b5d">Plataforma SaaS de Agendamento</text>

  <!-- Descrição -->
  <text x="24" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#556360">
    Solução completa de gestão e agendamento online 24/7
  </text>
  <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#556360">
    para clínicas, consultórios e prestadores de serviços.
  </text>

  <!-- Destaques / Features -->
  <g transform="translate(24, 134)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1c2826">
    <circle cx="4" cy="8" r="3" fill="#4a6b5d"/>
    <text x="14" y="12">Gestão de Salas, Equipes &amp; Multi-Unidades</text>

    <circle cx="4" cy="28" r="3" fill="#4a6b5d"/>
    <text x="14" y="32">Link Público Exclusivo &amp; Notificações</text>
  </g>

  <!-- Link Simulado / Badge -->
  <rect x="24" y="184" width="160" height="28" rx="6" fill="#4a6b5d"/>
  <text x="104" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Acessar Agenda →</text>
</svg>
